name: Weekly audit
# Builds the site from main exactly as Cloudflare does, then runs strict QA, the Pinterest feed checks, the outside-link check
# and the dependency audit. The latest result is the pinned issue "Monitor: weekly audit". A failure opens an alert.
on:
  schedule:
    - cron: '7 21 * * 6'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/watch/audit.mjs
