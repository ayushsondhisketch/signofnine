name: IndexNow after deploy
# Runs on every push to main (after Cloudflare Pages has had time to publish) and on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Cloudflare Pages to publish
        run: sleep 180
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow.mjs
